<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทดสอบการเชื่อมต่อ</title>
<style>body{font:16px/1.7 sans-serif;padding:16px;background:#fff;color:#222}b.ok{color:#1D825C}b.no{color:#C0392B}</style></head><body>
<h3>ทดสอบการเชื่อมต่อ (v1)</h3>
<p>หน้านี้แสดงได้ = เข้า toy113.github.io ได้ ✔</p>
<div id="o">กำลังทดสอบ...</div>
<script>
var T=[['LINE SDK','https://static.line-scdn.net/liff/edge/2/sdk.js'],['Apps Script','https://script.google.com/macros/s/AKfycbwOtmnWrY3vh9KFz2eoLuZgZuRRTduL-b3po4LSc6u4pjiH33unIN54Uhkc3yx8sT9k/exec?action=ping'],['Google Fonts','https://fonts.googleapis.com/css2?family=Sarabun&display=swap'],['LINE API','https://api.line.me/']];
var o=document.getElementById('o');o.innerHTML='';
T.forEach(function(t){var d=document.createElement('div');d.textContent=t[0]+' ... รอ';o.appendChild(d);var s=Date.now(),done=false;
 var tm=setTimeout(function(){if(!done){done=true;d.innerHTML=t[0]+': <b class="no">ไม่ตอบใน 10 วิ ✘</b>';}},10000);
 fetch(t[1],{mode:'no-cors',cache:'no-store'}).then(function(){if(done)return;done=true;clearTimeout(tm);d.innerHTML=t[0]+': <b class="ok">เข้าได้ ✔</b> '+(Date.now()-s)+' ms';}).catch(function(e){if(done)return;done=true;clearTimeout(tm);d.innerHTML=t[0]+': <b class="no">ถูกบล็อก/ผิดพลาด ✘</b> '+(Date.now()-s)+' ms';});});
</script></body></html>
