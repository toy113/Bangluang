<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ขอบคุณที่ให้คะแนน</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FBF7FA;font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif;color:#4A1F40;text-align:center;padding:24px;box-sizing:border-box;}
  .box{max-width:340px;}
  .star{font-size:46px;line-height:1;}
  h1{font-size:19px;margin:12px 0 6px;}
  p{font-size:14px;color:#7a6676;margin:0 0 16px;}
  a.btn{display:inline-block;background:#1D825C;color:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:12px;}
</style>
</head>
<body>
<div class="box">
  <div class="star">⭐⭐⭐⭐⭐</div>
  <h1 id="t">ขอบคุณมากค่ะ 💚</h1>
  <p id="m">กำลังพาไปหน้ารีวิว...</p>
  <a class="btn" id="go" href="https://g.page/r/CXrZfNExDQq4EBM/review" style="display:none;">⭐ รีวิวให้เรา</a>
</div>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbwOtmnWrY3vh9KFz2eoLuZgZuRRTduL-b3po4LSc6u4pjiH33unIN54Uhkc3yx8sT9k/exec';
  var q=new URLSearchParams(location.search), go=document.getElementById('go');
  var isOk=q.get('kind')==='ok';
  if(isOk){ document.querySelector('.star').textContent='💚'; document.title='ขอบคุณค่ะ'; document.getElementById('t').textContent='ดีใจที่อาการปกติดีค่ะ 💚'; }
  function fallback(msg, url){ if(url) go.href=url; go.style.display='inline-block'; document.getElementById('m').textContent=msg; }
  var done=false, timer=setTimeout(function(){ if(!done) fallback('กดปุ่มด้านล่างเพื่อไปหน้ารีวิวได้เลยค่ะ'); }, 6000);
  fetch(API+'?action=crmRateOpen&fu='+encodeURIComponent(q.get('fu')||'')+'&k='+encodeURIComponent(q.get('k')||'')+(isOk?'&kind=ok':''),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      done=true; clearTimeout(timer);
      if(d && d.ok && d.url){ location.replace(d.url); setTimeout(function(){ fallback('ถ้าหน้ารีวิวไม่เปิดเอง กดปุ่มด้านล่างค่ะ', d.url); }, 2500); }
      else fallback('กดปุ่มด้านล่างเพื่อไปหน้ารีวิวได้เลยค่ะ');
    })
    .catch(function(){ done=true; clearTimeout(timer); fallback('กดปุ่มด้านล่างเพื่อไปหน้ารีวิวได้เลยค่ะ'); });
})();
</script>
</body>
</html>
